name: Build & Deploy

on:
  workflow_call:
    inputs:
      github-ref:
        required: false
        type: string
        default: ${{ github.ref }}

      environment-name:
        required: true
        type: string

      artifact-name:
        required: true
        type: string

      channel-name:
        required: true
        type: string

      channel-expiration:
        required: false
        type: string
        default: ""

      api-base-url:
        required: true
        type: string

jobs:
  build-package:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

        with:
          ref: ${{ inputs.github-ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup node
        uses: actions/setup-node@v6

        with:
          cache: "pnpm"

      - name: Install package
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

        env:
          VITE_APP_API_HOST: ${{ inputs.api-base-url }}
          VITE_APP_TELEMETRY_HOST: ${{ vars.TELEMETRY_HOST }}
          VITE_APP_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

      - name: Prepare package
        run: cp firebase.json dist/

      - name: Upload package
        uses: actions/upload-artifact@v7

        with:
          name: ${{ inputs.artifact-name }}
          path: dist

  deploy-package:
    name: Deploy
    needs: build-package
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ steps.deployment_url.outputs.url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Download artifact
        uses: actions/download-artifact@v8

        with:
          name: ${{ inputs.artifact-name }}

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v3"
        with:
          access_token_scopes: ${{ vars.ACCESS_TOKEN_SCOPES }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase Hosting (Staging)
        if: ${{ inputs.environment-name == 'Staging' }}
        run: firebase hosting:channel:deploy --project ${{ vars.WEB_PROJECT_NAME }} ${{ inputs.channel-name }} ${{ inputs.channel-expiration }}

      - name: Deploy to Firebase Hosting (Production)
        if: ${{ inputs.environment-name == 'Production' }}
        run: firebase deploy --project ${{ vars.WEB_PROJECT_NAME }}

      - id: deployment_url
        name: Set environment URL
        run: |
          URL="$(firebase --project ${{ vars.WEB_PROJECT_NAME }} --non-interactive --json hosting:channel:open ${{ inputs.channel-name }} | jq -r '.result.url')"
          echo "url=$URL" >> $GITHUB_OUTPUT
