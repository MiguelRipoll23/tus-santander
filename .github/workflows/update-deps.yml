name: Update backend deps

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Update package manifest
        run: npx --yes npm-check-updates --upgrade

      - name: Install dependencies
        run: npm install

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update backend deps to latest version
          title: Update backend deps to latest version
          body: Automated pull request triggered by a cron job
          labels: dependencies
